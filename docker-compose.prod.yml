# Production-style stack for Lead Generator Website (Phase 10.4).
# Separate from docker-compose.yml (which is the dev DB only). Runs the built app
# image + Postgres. Provide secrets via an env file (see .env.example) — do NOT
# commit real secrets.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
    volumes:
      - leadgen_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-leadgen}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      JOBS_WORKER_TOKEN: ${JOBS_WORKER_TOKEN:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    healthcheck:
      # Reuses the liveness probe added in Task 8.
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3000/api/health/live\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5

  # Background worker trigger (Phase 8.5). A lightweight cron loop that pokes the
  # worker endpoint so queued jobs (AI generation, blog, deploy) actually process.
  worker:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
        curl -s -X POST -H "Authorization: Bearer ${JOBS_WORKER_TOKEN}"
        http://app:3000/api/jobs/run >/dev/null || true;
        sleep 30;
        done

volumes:
  leadgen_pgdata_prod:
