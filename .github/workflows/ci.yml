name: CI

# Runs the same gates used locally: lint → type-check → test → build.
# Keep this green; it is the contract for every push and pull request.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  verify:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        # Demo/CI build ships a localhost origin on purpose; acknowledge it so the
        # site-URL guard does not warn. Real deployments set NEXT_PUBLIC_SITE_URL.
        env:
          ALLOW_LOCALHOST_BUILD: '1'
        run: npm run build
